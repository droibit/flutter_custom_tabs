name: CI for all of docs

on:
  push:
    branches:
      - main
      - develop      
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7 
    - uses: DavidAnson/markdownlint-cli2-action@v24
      with:
        globs: '**/*.md'